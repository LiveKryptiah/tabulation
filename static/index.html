<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SK Federation Pageant Tabulation</title>
    <style>
        /* This section styles the webpage to look professional */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .tabulation-card {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        label {
            font-weight: bold;
            color: #555;
            display: block;
            margin-bottom: 8px;
        }
        select, input[type="number"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 25px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box; /* Ensures padding doesn't widen the box */
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        #status-message {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
            height: 20px; /* Keeps layout from shifting when text appears */
        }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>

    <div class="tabulation-card">
        <h2>SK Pageant Judging</h2>
        
        <!-- The form where judges input their scores -->
        <form id="scoringForm">
            <label for="candidate_number">Candidate Number:</label>
            <select id="candidate_number" name="candidate_number" required>
                <option value="" disabled selected>Select a Candidate</option>
                <option value="1">Candidate #1</option>
                <option value="2">Candidate #2</option>
                <option value="3">Candidate #3</option>
                <option value="4">Candidate #4</option>
                <option value="5">Candidate #5</option>
                <!-- Add more candidates here as needed -->
            </select>

            <label for="score">Total Score (1-100):</label>
            <input type="number" id="score" name="score" min="1" max="100" required placeholder="Enter score...">

            <button type="submit">Submit Score</button>
        </form>

        <!-- Where the "Success!" message will appear -->
        <div id="status-message"></div>
    </div>

    <script>
        // This JavaScript intercepts the form submission and sends it to your Python server wirelessly
        document.getElementById('scoringForm').addEventListener('submit', function(event) {
            // Prevent the page from refreshing
            event.preventDefault();

            const statusMessage = document.getElementById('status-message');
            statusMessage.textContent = "Sending...";
            statusMessage.className = ""; // Reset colors

            // Gather the data from the form
            const formData = new FormData(this);

            // Send the data to the Python server using the /submit_score route
            fetch('/submit_score', {
                method: 'POST',
                body: formData
            })
            .then(response => response.text())
            .then(data => {
                // If successful, show a green success message
                statusMessage.textContent = "Score submitted successfully!";
                statusMessage.className = "success";
                
                // Clear the form for the next candidate
                document.getElementById('scoringForm').reset();
                
                // Make the success message disappear after 3 seconds
                setTimeout(() => {
                    statusMessage.textContent = "";
                }, 3000);
            })
            .catch(error => {
                // If there's a network error, show a red error message
                statusMessage.textContent = "Error submitting score. Check connection.";
                statusMessage.className = "error";
                console.error('Error:', error);
            });
        });
    </script>

</body>
</html>
