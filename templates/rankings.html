<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Rankings - MISS SK YOUTH AMBASSADRESS 2026</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Geist', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #000000; 
            color: #ffffff; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            background-image: linear-gradient(to bottom, #000000 0%, #0a0a0a 100%);
        }

        .rankings-card { 
            background-color: #0a0a0a; 
            padding: 40px; 
            border-radius: 16px; 
            border: 1px solid #3a3a3f;
            width: 100%; 
            max-width: 900px; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }

        .eyebrow {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #10b981;
            text-align: center;
            margin-bottom: 8px;
        }

        h2 { 
            text-align: center; 
            color: #ffffff; 
            margin-bottom: 30px; 
            font-size: 24px; 
            font-weight: 800;
            text-transform: uppercase; 
            letter-spacing: 1.6px; 
            padding-bottom: 16px;
            border-bottom: 1px solid #3a3a3f;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        th {
            background-color: #000000;
            color: #8e8e93;
            padding: 14px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            border: 1px solid #3a3a3f;
        }

        td {
            padding: 14px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid #3a3a3f;
            color: #ffffff;
        }

        tr:nth-child(even) td {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .rank-top1 { color: #10b981; font-weight: 800; font-size: 16px; }
        .score-val { color: #10b981; font-weight: 800; font-size: 16px; }

        .btn-home {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 28px;
            background: transparent;
            color: #ffffff;
            border: 1px solid #10b981;
            border-radius: 32px; /* rounded.pill */
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1.4px;
            transition: all 0.2s ease;
        }

        .btn-home:hover {
            background-color: #10b981;
            color: #000000;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
        }
    </style>
</head>
<body>

    <div class="rankings-card" style="text-align: center;">
        <img src="{{ url_for('static', filename='sk_logo.png') }}" alt="MISS SK YOUTH AMBASSADRESS 2026 Logo" style="max-height: 120px; width: auto; object-fit: contain; margin-bottom: 12px; filter: drop-shadow(0 0 12px rgba(245, 158, 11, 0.4));">
        <div class="eyebrow">OFFICIAL LIVE LEADERBOARD</div>
        <h2>MISS SK YOUTH AMBASSADRESS 2026</h2>

        <table>
            <thead>
                <tr>
                    <th>RANK</th>
                    <th>CANDIDATE</th>
                    <th>PRELIMINARY SCORE</th>
                </tr>
            </thead>
            <tbody>
                {% for item in leaderboard %}
                <tr>
                    <td class="{% if loop.index == 1 %}rank-top1{% endif %}">Rank #{{ loop.index }}</td>
                    <td style="text-align: left; padding-left: 24px; font-weight: 800;">{{ item.candidate }}</td>
                    <td class="score-val">{{ item.score }} pts</td>
                </tr>
                {% else %}
                <tr><td colspan="3" style="padding: 30px; color: #8e8e93;">No scores recorded yet. Have judges submit scores!</td></tr>
                {% endfor %}
            </tbody>
        </table>

        <div style="text-align: center;">
            <a href="/login" class="btn-home">LOGIN PORTAL</a>
        </div>
    </div>

</body>
</html>
