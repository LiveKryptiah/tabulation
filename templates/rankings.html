<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SK Federation Pageant Tabulation</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .tabulation-card { background-color: white; padding: 40px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); width: 100%; max-width: 900px; }
        h2 { text-align: center; color: #333; margin-top: 0; margin-bottom: 30px; font-size: 28px; text-transform: uppercase; letter-spacing: 1px; }
        .form-layout { display: flex; gap: 40px; }
        
        .left-panel { flex: 1; border-right: 2px dashed #eee; padding-right: 40px; display: flex; flex-direction: column; }
        label.section-title { font-weight: bold; color: #555; display: block; margin-bottom: 20px; font-size: 18px; text-align: left; border-bottom: 2px solid #007bff; padding-bottom: 8px; display: inline-block; }
        
        .selected-preview { text-align: center; margin-bottom: 20px; min-height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .selected-preview img { width: 130px; height: 130px; object-fit: cover; border-radius: 50%; border: 4px solid #007bff; box-shadow: 0 4px 10px rgba(0,0,0,0.15); display: none; }
        .placeholder-circle { width: 130px; height: 130px; border-radius: 50%; background-color: #f0f0f0; border: 2px dashed #ccc; display: flex; align-items: center; justify-content: center; color: #999; font-size: 14px; text-align: center; padding: 10px; box-sizing: border-box; }
        .selected-preview h3 { margin: 15px 0 0 0; color: #333; font-size: 22px; }
        
        .candidate-list { display: flex; flex-direction: column; gap: 10px; max-height: 250px; overflow-y: auto; padding-right: 10px; }
        input[type="radio"] { display: none; }
        .list-item { cursor: pointer; }
        .list-content { display: flex; align-items: center; padding: 10px 15px; background-color: #fdfdfd; border: 1px solid #ddd; border-radius: 8px; transition: all 0.2s ease-in-out; }
        .list-content img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; margin-right: 15px; }
        .list-content span { font-weight: bold; color: #555; font-size: 16px; }
        input[type="radio"]:checked + .list-content { border-color: #007bff; background-color: #e9f2ff; transform: translateX(5px); }

        .right-panel { flex: 1; display: flex; flex-direction: column; justify-content: center; position: relative; }
        .step { display: none; } 
        .step.active { display: block; } 
        .step-indicator { text-align: right; color: #888; font-size: 13px; font-weight: bold; margin-bottom: 15px; }
        
        .criteria-item { margin-bottom: 15px; }
        .criteria-item label { font-size: 14px; font-weight: bold; color: #444; display: block; margin-bottom: 8px; }
        .criteria-item input[type="number"] { width: 100%; padding: 12px; border: 2px solid #ccc; border-radius: 6px; font-size: 18px; box-sizing: border-box; background-color: #fcfcfc; }
        
        .button-group { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 15px; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background-color 0.3s; }
        .btn-next { background-color: #007bff; }
        .btn-next:hover { background-color: #0056b3; }
        .btn-prev { background-color: #6c757d; }
        .btn-prev:hover { background-color: #5a6268; }
        .btn-submit { background-color: #28a745; }
        .btn-submit:hover { background-color: #218838; }

        #status-message { text-align: center; margin-top: 15px; font-weight: bold; height: 20px; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <div class="tabulation-card">
        <h2>SK Pageant Judging</h2>
        <form id="scoringForm" class="form-layout">
            
            <!-- LEFT PANEL -->
            <div class="left-panel">
                <label class="section-title">1. Select Candidate</label>
                <div class="selected-preview">
                    <div id="placeholder-circle" class="placeholder-circle">Select below</div>
                    <img id="preview-img" src="" alt="Selected Candidate">
                    <h3 id="preview-name">No Candidate Selected</h3>
                </div>
                
                <div class="candidate-list">
                    <label class="list-item">
                        <input type="radio" name="candidate_number" value="1" data-img="/static/candidate1.jpg" data-name="Candidate 1" required>
                        <div class="list-content">
                            <img src="/static/candidate1.jpg" alt="Candidate 1">
                            <span>Candidate 1</span>
                        </div>
                    </label>
                    <label class="list-item">
                        <input type="radio" name="candidate_number" value="2" data-img="/static/candidate2.jpg" data-name="Candidate 2" required>
                        <div class="list-content">
                            <img src="/static/candidate2.jpg" alt="Candidate 2">
                            <span>Candidate 2</span>
                        </div>
                    </label>
                    <label class="list-item">
                        <input type="radio" name="candidate_number" value="3" data-img="/static/candidate3.jpg" data-name="Candidate 3" required>
                        <div class="list-content">
                            <img src="/static/candidate3.jpg" alt="Candidate 3">
                            <span>Candidate 3</span>
                        </div>
                    </label>
                </div>
            </div>

            <!-- RIGHT PANEL WIZARD -->
            <div class="right-panel">
                <div class="step active" id="step-1">
                    <label class="section-title">Production Number (20%)</label>
                    <div class="step-indicator">Step 1 of 4</div>
                    <div class="criteria-item"><label>Mastery (1-10)</label><input type="number" name="p_mastery" min="1" max="10" required></div>
                    <div class="criteria-item"><label>Energy (1-5)</label><input type="number" name="p_energy" min="1" max="5" required></div>
                    <div class="criteria-item"><label>Presence (1-5)</label><input type="number" name="p_presence" min="1" max="5" required></div>
                    <div class="button-group"><button type="button" class="btn-next">Next &#8594;</button></div>
                </div>

                <div class="step" id="step-2">
                    <label class="section-title">Swimwear (25%)</label>
                    <div class="step-indicator">Step 2 of 4</div>
                    <div class="criteria-item"><label>Figure (1-10)</label><input type="number" name="s_figure" min="1" max="10" required></div>
                    <div class="criteria-item"><label>Walk (1-10)</label><input type="number" name="s_walk" min="1" max="10" required></div>
                    <div class="criteria-item"><label>Confidence (1-5)</label><input type="number" name="s_confidence" min="1" max="5" required></div>
                    <div class="button-group"><button type="button" class="btn-prev">&#8592; Prev</button><button type="button" class="btn-next">Next &#8594;</button></div>
                </div>

                <div class="step" id="step-3">
                    <label class="section-title">Formal Wear (25%)</label>
                    <div class="step-indicator">Step 3 of 4</div>
                    <div class="criteria-item"><label>Elegance (1-10)</label><input type="number" name="f_elegance" min="1" max="10" required></div>
                    <div class="criteria-item"><label>Poise (1-10)</label><input type="number" name="f_poise" min="1" max="10" required></div>
                    <div class="criteria-item"><label>Suitability (1-5)</label><input type="number" name="f_suitability" min="1" max="5" required></div>
                    <div class="button-group"><button type="button" class="btn-prev">&#8592; Prev</button><button type="button" class="btn-next">Next &#8594;</button></div>
                </div>

                <div class="step" id="step-4">
                    <label class="section-title">Q & A (30%)</label>
                    <div class="step-indicator">Step 4 of 4</div>
                    <div class="criteria-item"><label>Content (1-15)</label><input type="number" name="q_content" min="1" max="15" required></div>
                    <div class="criteria-item"><label>Delivery (1-10)</label><input type="number" name="q_delivery" min="1" max="10" required></div>
                    <div class="criteria-item"><label>Wit (1-5)</label><input type="number" name="q_wit" min="1" max="5" required></div>
                    <div class="button-group"><button type="button" class="btn-prev">&#8592; Prev</button><button type="submit" class="btn-submit">Submit Scores</button></div>
                </div>
                <div id="status-message"></div>
            </div>
        </form>
    </div>

    <script>
        const radioButtons = document.querySelectorAll('input[name="candidate_number"]');
        const previewImg = document.getElementById('preview-img');
        const placeholderCircle = document.getElementById('placeholder-circle');
        const previewName = document.getElementById('preview-name');

        radioButtons.forEach(radio => {
            radio.addEventListener('change', function() {
                placeholderCircle.style.display = 'none';
                previewImg.style.display = 'block';
                previewImg.src = this.getAttribute('data-img');
                previewName.textContent = this.getAttribute('data-name');
            });
        });

        let currentStep = 1;
        function showStep(stepNumber) {
            document.querySelectorAll('.step').forEach(step => step.classList.remove('active'));
            document.getElementById(`step-${stepNumber}`).classList.add('active');
        }

        document.querySelectorAll('.btn-next').forEach(button => {
            button.addEventListener('click', () => {
                if (currentStep === 1 && !document.querySelector('input[name="candidate_number"]:checked')) {
                    alert("Please select a candidate from the left panel first!");
                    return; 
                }
                const inputs = document.getElementById(`step-${currentStep}`).querySelectorAll('input');
                let allValid = true;
                inputs.forEach(input => {
                    if (!input.checkValidity()) { input.reportValidity(); allValid = false; }
                });
                if (allValid) { currentStep++; showStep(currentStep); }
            });
        });

        document.querySelectorAll('.btn-prev').forEach(button => {
            button.addEventListener('click', () => { currentStep--; showStep(currentStep); });
        });

        document.getElementById('scoringForm').addEventListener('submit', function(event) {
            event.preventDefault(); 
            const statusMessage = document.getElementById('status-message');
            statusMessage.textContent = "Sending..."; statusMessage.className = ""; 
            
            fetch('/submit_score', { method: 'POST', body: new FormData(this) })
            .then(response => response.text())
            .then(data => {
                statusMessage.textContent = "Scores submitted successfully!"; statusMessage.className = "success";
                document.getElementById('scoringForm').reset();
                currentStep = 1; showStep(currentStep);
                placeholderCircle.style.display = 'flex'; previewImg.style.display = 'none'; previewName.textContent = "No Candidate Selected";
                setTimeout(() => { statusMessage.textContent = ""; }, 3000);
            })
            .catch(error => {
                statusMessage.textContent = "Error submitting scores. Check connection."; statusMessage.className = "error";
            });
        });
    </script>
</body>
</html>
